{% extends "base.html" %}

{% block title %}Group detail{% endblock %}

{% block content %}
  <h1>{% if action == 'C' %}Добавлена группа
    {% elif action == 'E' %}Изменена группа
    {% elif action == 'D' %}Удалена группа
    {% else %}Группа
    {% endif %}
  </h1>
  <h2>
      {{ group.name }}
  </h2>
  <a href="{% url 'account:group_list' %}">Вернуться к списку</a>
  <a href="{{request.META.HTTP_REFERER|escape}}">Go back</a>
{% endblock %}
