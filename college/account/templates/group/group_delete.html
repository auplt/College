{% extends "base.html" %}

{% block title %}Group delete{% endblock %}

{% block content %}
    <h1>Удаление группы</h1>
    <h2>{{ group.name }}</h2>
    <form method="POST">
        <p>Вы точно хотите удалить эту группу?</p>
        <input type="submit" value="Да">
        <a href="{% url 'account:group_list' %}">Отмена</a>
        {% csrf_token %}
    </form>
    <a href="{% url 'account:group_list' %}">Вернуться к списку</a>
{% endblock %}
