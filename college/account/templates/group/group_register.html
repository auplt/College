{% extends "base.html" %}

{% block title %}Create a group{% endblock %}

{% block content %}
  <h1>Создание новой группы</h1>
  <p>Создайте группу, используя форму ниже:</p>
  <form class="register_group" method="post">
    {{ group_form.as_p }}
    {% csrf_token %}
    <p><input type="submit" value="Создать группу"></p>
  </form>
{% endblock %}
