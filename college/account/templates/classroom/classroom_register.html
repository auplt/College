{% extends "base.html" %}

{% block title %}Create a classroom{% endblock %}

{% block content %}
  <h1>Создание новой аудитории</h1>
  <p>Создайте аудитории, используя форму ниже:</p>
  <form class="register_group" method="post">
    {{ classroom_form.as_p }}
    {% csrf_token %}
    <p><input type="submit" value="Создать аудиторию"></p>
  </form>
{% endblock %}
