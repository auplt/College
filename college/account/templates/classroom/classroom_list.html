{% extends "base.html" %}

{% block title %}Classroom list{% endblock %}

{% block content %}
    <h1>Список аудиторий</h1>
    <a href="{% url 'account:classroom_register' %}">Добавить</a>
    {% for classroom in classrooms %}
        <h2>{{classroom.number}}</h2>
        <p>Описание: {{classroom.description}}</p>
        <a href="{{ classroom.get_absolute_url }}">Редактировать</a>
        <a href="{{ classroom.get_delete_url }}">Удалить</a>
    {% endfor %}
{% endblock %}
